name: Verify VIZRO 1.0.1 security downloads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify published installer hashes and signatures
        run: |
          set -euo pipefail
          mkdir native
          gh release download v1.0.1 --pattern '*.exe' --pattern '*.dmg' --pattern '*Attestation.sigstore.json' --dir native
          python3 - <<'PY'
          import pathlib,hashlib,json
          expected=json.loads('{"VIZRO-STUDIO-1.0.1-Windows-x64-Setup.exe":"2cef63d8bddf7e43de58aab49af3f36c18e7e09d0f9186e35ffc41dfad48efa9","VIZRO-STUDIO-1.0.1-macOS-arm64.dmg":"2ad66e4cc9519fd183ee689388ccabdd275a188c6cd4ddb510a8d9aa21480918","VIZRO-STUDIO-1.0.1-macOS-x64.dmg":"b9ef0fec206886dc2c956e6a7f2592e7f7c8604d6a8eafdc25071ab66105291c"}')
          for name,sha in expected.items():
              assert hashlib.sha256(pathlib.Path('native',name).read_bytes()).hexdigest()==sha,name
          PY
          for file in native/*.exe native/*.dmg; do
            gh attestation verify "$file" --repo "$GH_REPO" --bundle native/VIZRO-STUDIO-1.0.1-Release-Attestation.sigstore.json --predicate-type https://github.com/hridayne/VIZRO/attestations/release-verification/v1
          done
