name: Publish VIZRO 1.0.2 login-fix installers
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-login-1.0.2.yml]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
    steps:
      - name: Download approved binaries and verify bytes
        run: |
          set -euo pipefail
          mkdir native
          python3 - <<'PY'
          import json,base64,pathlib,hashlib,urllib.request
          items=json.loads("[{\"name\":\"VIZRO-STUDIO-1.0.2-Windows-x64-Setup.exe\",\"sha256\":\"aa5bdb31b9426d4b3bf615c150ec5926ea81ae5eacbd4ed1d19f42475dd71b81\",\"url64\":\"\"},{\"name\":\"VIZRO-STUDIO-1.0.2-macOS-x64.dmg\",\"sha256\":\"ec9a60b8e9a0b995adde49567ce5886a997ca7a9f028f4021ad837cfba141c77\",\"url64\":\"\"},{\"name\":\"VIZRO-STUDIO-1.0.2-macOS-arm64.dmg\",\"sha256\":\"3e1e9a43d539944e7b950fddde438533430fb625318dfd5fd4aedeee8953d25e\",\"url64\":\"\"}]")
          for item in items:
              p=pathlib.Path('native')/item['name']
              with urllib.request.urlopen(base64.b64decode(item['url64']).decode(),timeout=180) as r,p.open('wb') as f:
                  import shutil;shutil.copyfileobj(r,f)
              assert p.stat().st_size>100000000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
              with p.open('rb') as f:
                  if p.suffix=='.exe':assert f.read(2)==b'MZ'
                  else:f.seek(-512,2);assert f.read(4)==b'koly'
          pathlib.Path('native/SHA256SUMS.txt').write_text(''.join(i['sha256']+'  '+i['name']+'\n' for i in items))
          predicate={'version':'1.0.2','sourceRun':'https://github.com/hridayne/ndr-studio-desktop/actions/runs/40065806991','checks':'Downloaded release binaries matched expected SHA-256 and native container signatures. Native runner install/mount and short launch smoke passed.','limitations':'This is release integrity verification, not build provenance, malware certification, OS publisher signing, Apple notarization or production login acceptance. Plugin 1.0.2 server deployment is required.'}
          pathlib.Path('native/release-verification.json').write_text(json.dumps(predicate,indent=2))
          PY
      - name: Attest verified release integrity
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            native/*.exe
            native/*.dmg
          predicate-type: https://github.com/hridayne/VIZRO/attestations/release-verification/v1
          predicate-path: native/release-verification.json
      - name: Publish installer-only release for acceptance testing
        env: {BUNDLE: '${{ steps.attest.outputs.bundle-path }}'}
        run: |
          set -euo pipefail
          cp "$BUNDLE" native/VIZRO-STUDIO-1.0.2-Release-Attestation.sigstore.json
          cat > notes.md <<'EOF'
          Fixes desktop navigation to the custom https://vizro.in/login/ page and keeps the centered opening visible for 7 seconds from ready-to-show.

          **Install VIZRO STUDIO Plugin 1.0.2 on the server before installing these apps.** The companion plugin fixes desktop login routing, its missing public CSS, and logout/session-expiry links. Server deployment and real-account acceptance are still pending, so this release is marked pre-release.

          Windows x64, Mac Intel and Mac Apple Silicon installers passed native install/mount and short launch smoke tests. App source: 61 automated checks passed. Existing security path checks and Electron 45.0.0 remain.

          GitHub/Sigstore verifies these release bytes and workflow identity. It is not Windows Authenticode, Apple Developer ID/notarization, malware-free certification, or endorsement. Browser and OS warnings may remain. Native updates require manual installation; plugin/UI/settings/tune still load online.

          Powered by BHP Production.
          EOF
          gh release create v1.0.2 --draft --prerelease --latest=false --target "$GITHUB_SHA" --title 'VIZRO STUDIO 1.0.2 — Login & 7-second Opening Fix' --notes-file notes.md
          gh release upload v1.0.2 native/*.exe native/*.dmg native/*.txt native/*.json
          gh release edit v1.0.2 --draft=false --prerelease --latest=false
      - name: Check public anonymous download bytes
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,urllib.request
          for line in pathlib.Path('native/SHA256SUMS.txt').read_text().splitlines():
              sha,name=line.split();h=hashlib.sha256()
              with urllib.request.urlopen('https://github.com/hridayne/VIZRO/releases/download/v1.0.2/'+name,timeout=180) as r:
                  while chunk:=r.read(1048576):h.update(chunk)
              assert h.hexdigest()==sha,name
              print('ANONYMOUS_DOWNLOAD_OK',name,sha)
          PY
