name: Verify VIZRO 1.0.2 public downloads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
    steps:
      - name: Verify downloaded installer integrity attestations
        run: |
          set -euo pipefail
          mkdir native
          gh release download v1.0.2 --pattern '*.exe' --pattern '*.dmg' --pattern '*Attestation.sigstore.json' --pattern SHA256SUMS.txt --dir native
          cd native
          sha256sum --check SHA256SUMS.txt
          for file in *.exe *.dmg; do
            gh attestation verify "$file" --repo "$GH_REPO" --bundle VIZRO-STUDIO-1.0.2-Release-Attestation.sigstore.json --predicate-type https://github.com/hridayne/VIZRO/attestations/release-verification/v1
          done
