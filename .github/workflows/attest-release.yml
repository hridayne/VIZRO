name: Sign VIZRO release verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/attest-release.yml]
permissions:
  contents: read
jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PREDICATE_TYPE: https://github.com/hridayne/VIZRO/attestations/release-verification/v1
    steps:
      - name: Download published installers and verify approved hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir native
          gh release download v1.0.0 --pattern '*.exe' --pattern '*.dmg' --pattern SHA256SUMS.txt --dir native
          python3 - <<'PY'
          import pathlib,hashlib,json,os,datetime
          expected={
            'VIZRO-STUDIO-1.0.0-Windows-x64-Setup.exe':'952d2fe5614c373a197452538e0697e22691c8be72fb1a9ca729c08aa1124f28',
            'VIZRO-STUDIO-1.0.0-macOS-x64.dmg':'573f1c1d8c8748aa047f270fcd225827d8346ad8a3f5e38a6571366f12e33c2b',
            'VIZRO-STUDIO-1.0.0-macOS-arm64.dmg':'7a75842b6db934c524a26d0f4f1381b33c403c27d8492b5095e46abacebdb4f8'
          }
          recorded={}
          for line in pathlib.Path('native/SHA256SUMS.txt').read_text().splitlines():
              sha,name=line.split();assert name not in recorded;recorded[name]=sha
          assert recorded==expected
          for name,sha in expected.items():
              assert hashlib.sha256(pathlib.Path('native',name).read_bytes()).hexdigest()==sha,name
              print('VERIFIED '+name)
          predicate={
            'kind':'published-release-checksum-verification',
            'release':'https://github.com/hridayne/VIZRO/releases/tag/v1.0.0',
            'repository':os.environ['GITHUB_REPOSITORY'],
            'verificationWorkflowRun':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
            'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'result':'All three downloaded release installers match the approved SHA-256 manifest.',
            'scope':'Release integrity verification only. This workflow did not build the installers and does not assert build provenance, malware scanning, Windows Authenticode signing or Apple Developer ID/notarization.'
          }
          pathlib.Path('release-verification.json').write_text(json.dumps(predicate,indent=2))
          PY
      - name: Sign verification attestation with GitHub Actions and Sigstore
        id: sign
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: native/SHA256SUMS.txt
          predicate-type: https://github.com/hridayne/VIZRO/attestations/release-verification/v1
          predicate-path: release-verification.json
      - name: Verify signatures for all three installers
        env:
          BUNDLE_PATH: ${{ steps.sign.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          for file in native/*.exe native/*.dmg; do
            gh attestation verify "$file" --repo "$GH_REPO" --bundle "$BUNDLE_PATH" --predicate-type "$PREDICATE_TYPE"
          done
      - name: Attach signed verification bundle to the existing release
        env:
          BUNDLE_PATH: ${{ steps.sign.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.sign.outputs.attestation-url }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" VIZRO-STUDIO-1.0.0-Release-Attestation.sigstore.json
          cat > VERIFY-RELEASE.txt <<'GUIDE'
          VIZRO STUDIO 1.0.0 — signed release-integrity attestation
          Signer identity: hridayne/VIZRO GitHub Actions workflow via Sigstore.
          This verifies release-file identity and the signed checksum-verification statement.
          It is not Windows Authenticode, Apple Developer ID/notarization, malware certification, or a statement that GitHub built the installers.

          Download your installer and VIZRO-STUDIO-1.0.0-Release-Attestation.sigstore.json from this GitHub Release.
          With GitHub CLI installed, run (replace INSTALLER_FILENAME with your file):
          gh attestation verify INSTALLER_FILENAME --repo hridayne/VIZRO --bundle VIZRO-STUDIO-1.0.0-Release-Attestation.sigstore.json --predicate-type https://github.com/hridayne/VIZRO/attestations/release-verification/v1

          All three installer signatures were verified by the release verification workflow.
          Existing EXE/DMG download URLs and installer bytes remain the same.
          GUIDE
          printf '\nAttestation record: %s\n' "$ATTESTATION_URL" >> VERIFY-RELEASE.txt
          gh release upload v1.0.0 VIZRO-STUDIO-1.0.0-Release-Attestation.sigstore.json release-verification.json VERIFY-RELEASE.txt --clobber
          gh release view v1.0.0 --json body --jq .body > release-notes.md
          python3 - <<'PY'
          import pathlib,os
          p=pathlib.Path('release-notes.md');text=p.read_text()
          heading='## Signed release-integrity attestation'
          text=text.split(heading)[0].rstrip()
          p.write_text(text+'\n\n'+heading+'\n\nGitHub Actions/Sigstore signed checksum-verification attestation is attached for all three installers. Signatures verified successfully.\n\nRecord: '+os.environ['ATTESTATION_URL']+'\n\nSee VERIFY-RELEASE.txt for verification instructions. This attests release integrity, not installer build provenance or OS publisher signing; the installation warning information above still applies.\n')
          PY
          gh release edit v1.0.0 --notes-file release-notes.md
          echo "SIGNED_ATTESTATION_URL=$ATTESTATION_URL"
