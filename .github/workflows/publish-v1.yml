name: Verify VIZRO public downloads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public installer checksums without authentication
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib
          release=json.load(urllib.request.urlopen('https://api.github.com/repos/hridayne/VIZRO/releases/tags/v1.0.0'))
          assert not release['draft']
          assets={a['name']:a['browser_download_url'] for a in release['assets']}
          sums=urllib.request.urlopen(assets['SHA256SUMS.txt']).read().decode()
          for line in sums.splitlines():
              expected,name=line.split()
              h=hashlib.sha256()
              with urllib.request.urlopen(assets[name]) as r:
                  while chunk:=r.read(1024*1024):h.update(chunk)
              assert h.hexdigest()==expected,name
              print('Anonymous download verified: '+name)
          PY
